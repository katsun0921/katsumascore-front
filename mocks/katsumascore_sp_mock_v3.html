<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KatsumaScore SP Mock v3</title>

<style>
body{margin:0;font-family:sans-serif;background:#f3f4f6;color:#111}
.container{padding:16px}

.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#1e1b4b;color:#fff}

.breadcrumb{font-size:12px;color:#6b7280;padding:8px 16px;background:#fff}

.hero{padding:20px 16px;background:#1e1b4b;color:#fff}

.filter{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.filter button{white-space:nowrap;border:none;background:#ddd;padding:6px 10px}

.featured{background:#14082e;color:#fff;padding:16px;margin:16px 0}
.featured img{width:100%;border-radius:6px;margin-bottom:10px}
.score{color:#ff2dfc;font-size:24px;font-weight:bold}

.ranking-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #ddd}
.ranking-item img{width:70px;height:100px;object-fit:cover;border-radius:4px}

.ad{background:#e5e7eb;padding:16px;text-align:center;margin:16px 0}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#fff;padding:8px;border:1px solid #ddd}
.card img{width:100%;border-radius:4px;margin-bottom:6px}

.pagination{text-align:center;margin:20px 0}
.pagination span{margin:0 5px;padding:6px 10px;background:#ddd}

.footer{background:#1e1b4b;color:#fff;text-align:center;padding:16px;margin-top:20px}
</style>
</head>

<body>

<div class="header">
<div>LOGO</div>
<div>🔍</div>
</div>

<div class="breadcrumb">ホーム › 映画</div>

<div class="hero">
<h1>映画</h1>
<p>今観るべき作品を、スコアで選ぶ</p>
</div>

<div class="container">

<div class="filter">
<button>評価順</button>
<button>新着</button>
<button>配信中</button>
<button>Netflix</button>
</div>

<div class="featured">
<img src="https://picsum.photos/400/220" alt="">
<div class="score">4.3</div>
<div>イコライザー</div>
<div>“正義は、暴力を選ぶ”</div>
</div>

<div class="ranking">

<div class="ranking-item">
<img src="https://picsum.photos/100/150">
<div>
<div>#1</div>
<div class="score">4.3</div>
<div>イコライザー</div>
<div>完成度の高い復讐劇</div>
</div>
</div>

<div class="ranking-item">
<img src="https://picsum.photos/101/150">
<div>
<div>#2</div>
<div class="score">4.1</div>
<div>M3GAN</div>
<div>AIホラーの新境地</div>
</div>
</div>

<div class="ranking-item">
<img src="https://picsum.photos/102/150">
<div>
<div>#3</div>
<div class="score">3.9</div>
<div>トロール</div>
<div>北欧神話×怪獣</div>
</div>
</div>

</div>

<div class="ad">広告（ランキング後）</div>

<div class="grid">
<div class="card">
<img src="https://picsum.photos/200/120">
<div>ナイブズ・アウト</div>
</div>
<div class="card">
<img src="https://picsum.photos/201/120">
<div>ワン・バトル・アフター・アザー</div>
</div>
<div class="card">
<img src="https://picsum.photos/202/120">
<div>オイサマ</div>
</div>
<div class="card">
<img src="https://picsum.photos/203/120">
<div>テル・トゥルース</div>
</div>
</div>

<div class="ad">広告（グリッド前）</div>

<div class="pagination">
<span>1</span><span>2</span><span>3</span><span>次へ</span>
</div>

</div>

<div class="footer">© KatsumaScore</div>

</body>
</html>
