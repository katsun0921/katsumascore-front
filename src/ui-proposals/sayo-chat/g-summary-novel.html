<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サヨ会話UI 案G 要約＋ノベル</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
  <!--
    案G：案D（カードの要約・迷ったら探す）を土台に、「詳しく知りたい」で案C（ノベル風）へ切り替える
    - TOP・リスト・カードの「要約」・入口ボックス・モーダルの見た目は案Dと同じ。
    - モーダルは「読む」ことに絞る（承認済み要約・気分タグ。LLMなし・回数を減らさない）。
      案Dのモーダルにあった「もっと聞く」の会話は、ノベル側へ移した。
    - 「詳しく知りたい」を押すと、立ち絵が全面に出るノベル風の画面になり、サヨと話しながら
      見どころ・惜しいところ・似た作品・結末（ネタバレ）を聞ける。ここから先はLLM（1回ずつ数える）。
    - 探した結果のモーダルにも「詳しく知りたい」を置く。ノベル側では、作品を選んで話を聞いたり、
      ほかの気分で探し直したりできる。
    - ノベル側の「← 要約に戻る／結果に戻る」でモーダルへ、✕で一覧へ戻る。
    - URL：?view=top|list、?open={記事ID}（要約モーダルを開く）、?novel={記事ID}（ノベル画面を開く）、?embed=1
  -->
  <style>
    :root {
      --color-secondary: #1e1b4b;
      --color-accent: #6d28d9;
      --color-accent-strong: #ff2dfc;
      --color-accent-soft: #c084fc;
      --color-bg: #ffffff;
      --color-bg-muted: #f3f4f6;
      --color-bg-dark: #0a0618;
      --color-surface-dark: #1a1030;
      --color-surface-dark-2: #241843;
      --color-text-primary: #111827;
      --color-text-secondary: #6b7280;
      --color-text-inverse: #ffffff;
      --color-text-dim: #b7aed1;
      --color-border: #d1d5db;
      --color-border-dark: #34285a;
      --color-score-bg: #14082e;
      --color-unext: #1a1a1a;
      --color-netflix: #e50914;
      --color-amazon: #00a8e1;
      --color-dmmtv: #ff4b00;
      --color-disney: #113ccf;
      --color-hulu: #1ce783;
      --color-sayo-paper: #fffaf2;
      --color-sayo-amber: #c8862e;
      --color-sayo-amber-soft: #f3dfc1;
      --color-sayo-wood: #5b3a24;
      --color-sayo-text: #2f2219;
      --color-sayo-sub: #7a6656;
      --color-sayo-line: #e3d4bf;
      --color-black-rgb: 0, 0, 0;
      --color-white-rgb: 255, 255, 255;
      --color-accent-strong-rgb: 255, 45, 252;
      --font-body: 'Noto Sans JP', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--font-body); color: var(--color-text-primary); background: var(--color-bg); line-height: 1.7; }
    button, input { font: inherit; color: inherit; }
    a { color: inherit; }

    /* ── モック用の切替バー（本番には無い） ── */
    .mockBar {
      position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
      padding: 8px 16px; background: #fffbe6; border-bottom: 1px dashed #b59f00; font-size: 12px; color: #3b3200;
    }
    .mockBar__group { display: flex; gap: 4px; align-items: center; }
    .mockBar button { all: unset; cursor: pointer; padding: 2px 10px; border-radius: 999px; border: 1px solid #b59f00; }
    .mockBar button[aria-pressed="true"] { background: #3b3200; color: #fffbe6; }
    .mockBar button:focus-visible { outline: 2px solid #3b3200; outline-offset: 2px; }

    .siteHeader { background: var(--color-secondary); color: var(--color-text-inverse); padding: 12px 16px; font-weight: 700; }

    /* ── Sayoボタン（カードの上に重ねる。リンクの外の兄弟要素） ── */
    .sayoBtn {
      all: unset; cursor: pointer; position: absolute; z-index: 2;
      display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 2px; border-radius: 999px;
      background: rgba(10, 6, 24, .78); color: var(--color-text-inverse); font-size: 11px; font-weight: 700; line-height: 1;
      box-shadow: 0 0 0 1.5px var(--color-accent-strong), 0 4px 12px rgba(var(--color-black-rgb), .35);
      backdrop-filter: blur(4px); transition: transform .15s ease, box-shadow .15s ease;
    }
    .sayoBtn img { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; }
    .sayoBtn:hover { transform: translateY(-1px) scale(1.04); box-shadow: 0 0 0 2px var(--color-accent-strong), 0 6px 18px rgba(var(--color-accent-strong-rgb), .45); }
    .sayoBtn:focus-visible { outline: 2px solid var(--color-accent-soft); outline-offset: 3px; }

    /* ── TOPページ（ダーク・HomeCard） ── */
    .top { background: var(--color-bg-dark); color: var(--color-text-inverse); padding: 24px 0 64px; }
    .top__section { padding: 16px 0 24px; }
    .top__head { display: flex; justify-content: space-between; align-items: baseline; padding: 0 16px 12px; }
    .top__title { font-size: 18px; font-weight: 700; }
    .top__title small { display: block; font-size: 10px; letter-spacing: .2em; color: var(--color-accent-strong); }
    .top__more { font-size: 12px; color: var(--color-text-dim); }
    .top__intro {
      margin: 0 16px 8px; padding: 10px 14px; border-radius: 12px; background: var(--color-surface-dark);
      border: 1px solid var(--color-border-dark); display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--color-text-dim);
    }
    .top__intro img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
    .top__intro strong { color: var(--color-text-inverse); }
    .scroll { display: flex; gap: 12px; overflow-x: auto; padding: 4px 16px 8px; scrollbar-width: none; }
    .homeCard { position: relative; flex: 0 0 160px; width: 160px; }
    .homeCard__link { display: block; text-decoration: none; }
    .homeCard__media { position: relative; width: 160px; height: 218px; border-radius: 10px; overflow: hidden; transition: transform .2s; }
    .homeCard__link:hover .homeCard__media { transform: scale(1.03); }
    .homeCard__title { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 12px; font-weight: 600; line-height: 1.4; margin-top: 8px; }
    .homeCard__cat { font-size: 10px; color: var(--color-text-secondary); }
    .homeCard .sayoBtn { top: 8px; right: 8px; }
    .hex {
      position: absolute; top: 8px; left: 8px; width: 38px; height: 42px; display: grid; place-items: center; text-align: center;
      background: var(--color-score-bg); color: var(--color-text-inverse); font-size: 12px; font-weight: 700; line-height: 1;
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
    }
    .hex small { display: block; font-size: 8px; color: var(--color-accent-strong); }
    .dots { position: absolute; right: 8px; bottom: 8px; display: flex; gap: 3px; }
    .dots i { width: 8px; height: 8px; border-radius: 50%; border: 1px solid rgba(var(--color-white-rgb), .8); }

    /* ── リストページ（PostCardImgLeft＋ImgTop） ── */
    .list__hero { background: var(--color-secondary); color: var(--color-text-inverse); padding: 32px 16px; }
    .list__eyebrow { font-size: 11px; letter-spacing: .2em; color: var(--color-accent-strong); }
    .list__h1 { font-size: 26px; }
    .list__body { max-width: 1120px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 16px; }
    .postCard { position: relative; border-radius: 12px; overflow: hidden; background: var(--color-bg); border: 1px solid var(--color-border); }
    .postCard__link { display: grid; text-decoration: none; }
    .postCard__media { position: relative; aspect-ratio: 16/9; }
    .postCard__body { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 4px; }
    .postCard__date { font-size: 11px; color: var(--color-text-secondary); }
    .postCard__title { font-size: 14px; font-weight: 700; line-height: 1.45; }
    .postCard__excerpt { font-size: 12px; color: var(--color-text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .postCard .sayoBtn { right: 8px; top: 8px; }
    .lead .postCard__link { grid-template-columns: 1fr; }
    @media (min-width: 768px) {
      .lead .postCard__link { grid-template-columns: 1.2fr 1fr; }
      .lead .postCard__body { padding: 20px 24px; justify-content: center; }
      .lead .postCard__title { font-size: 20px; }
      .lead .postCard__excerpt { -webkit-line-clamp: 4; font-size: 14px; }
    }
    .lead .sayoBtn { font-size: 12px; padding-right: 12px; }
    .lead .sayoBtn img { width: 26px; height: 26px; }
    .grid { list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    @media (min-width: 768px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; } }
    @media (max-width: 767px) { .grid .postCard__excerpt { display: none; } .grid .sayoBtn span { display: none; } .grid .sayoBtn { padding-right: 2px; } }

    /* ── パターン1：迷ったらサヨに（検索の入口） ── */
    .askBox {
      display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 16px;
      background: var(--color-surface-dark); border: 1px solid var(--color-border-dark); color: var(--color-text-inverse);
    }
    .top .askBox { margin: 0 16px 8px; }
    .askBox__face { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; flex: none; box-shadow: 0 0 0 2px var(--color-accent-strong); }
    .askBox__main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
    .askBox__q { font-weight: 700; font-size: 15px; line-height: 1.5; }
    .askBox__q small { display: block; font-weight: 400; font-size: 11px; color: var(--color-text-dim); }
    .askBox__chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .askBox__chip {
      all: unset; cursor: pointer; white-space: nowrap; font-size: 13px; padding: 4px 12px; border-radius: 999px;
      background: var(--color-surface-dark-2); border: 1px solid var(--color-accent-soft);
    }
    .askBox__chip:hover, .askBox__chip:focus-visible { background: var(--color-accent); border-color: var(--color-accent); }
    .askBox__form { display: flex; gap: 6px; }
    .askBox__form input { flex: 1; min-width: 0; border: 1px solid var(--color-border-dark); border-radius: 999px; padding: 6px 14px; background: var(--color-bg-dark); color: var(--color-text-inverse); font-size: 16px; }
    .askBox__form input::placeholder { color: var(--color-text-dim); }
    .askBox__form input:focus { outline: 2px solid var(--color-accent-soft); }
    .askBox__form button { all: unset; cursor: pointer; padding: 6px 14px; border-radius: 999px; background: var(--color-accent-strong); color: var(--color-bg-dark); font-weight: 700; font-size: 13px; }
    .askBox__hint { font-size: 10px; color: var(--color-text-dim); }

    /* ── モーダル ── */
    .modal { position: fixed; inset: 0; z-index: 70; display: grid; align-items: end; }
    .modal[hidden] { display: none; }
    .modal__scrim { position: absolute; inset: 0; background: rgba(var(--color-black-rgb), .6); backdrop-filter: blur(3px); animation: fade .2s ease; }
    @keyframes fade { from { opacity: 0; } }
    .modal__sheet {
      position: relative; width: 100%; max-height: 90vh; display: flex; flex-direction: column;
      background: var(--color-sayo-paper); color: var(--color-sayo-text); border-radius: 20px 20px 0 0; overflow: hidden;
      animation: up .3s cubic-bezier(.2,.8,.2,1);
    }
    @keyframes up { from { transform: translateY(40px); opacity: 0; } }
    @media (min-width: 768px) {
      .modal { align-items: center; justify-items: center; padding: 24px; }
      .modal__sheet { width: 600px; max-height: min(760px, calc(100vh - 48px)); border-radius: 20px; }
    }
    .modal__grab { width: 40px; height: 4px; border-radius: 999px; background: var(--color-sayo-line); margin: 8px auto 0; }
    @media (min-width: 768px) { .modal__grab { display: none; } }
    .modal__top { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--color-sayo-line); align-items: center; }
    .modal__thumb { width: 56px; height: 76px; border-radius: 6px; flex: none; position: relative; }
    .modal__meta { flex: 1; min-width: 0; }
    .modal__cat { font-size: 11px; color: var(--color-sayo-sub); }
    .modal__title { font-size: 17px; font-weight: 700; line-height: 1.4; }
    .modal__info { font-size: 11px; color: var(--color-sayo-sub); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .modal__score { background: var(--color-score-bg); color: var(--color-text-inverse); font-weight: 700; padding: 0 6px; border-radius: 4px; }
    .modal__score b { color: var(--color-accent-strong); margin-left: 2px; }
    .modal__close { all: unset; cursor: pointer; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 18px; flex: none; }
    .modal__close:hover, .modal__close:focus-visible { background: var(--color-sayo-amber-soft); }
    .modal__scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

    .say { display: flex; gap: 10px; animation: rise .3s ease; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    .say__face { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; flex: none; border: 2px solid var(--color-sayo-amber-soft); }
    .say__body { flex: 1; min-width: 0; }
    .say__name { font-size: 11px; color: var(--color-sayo-sub); }
    .say__bubble { background: var(--color-sayo-amber-soft); border-radius: 4px 16px 16px 16px; padding: 10px 14px; font-size: 14px; line-height: 1.85; }
    .say__lead { font-weight: 700; display: block; margin-bottom: 2px; }
    .say--user { justify-content: flex-end; }
    .say--user .say__bubble { background: var(--color-secondary); color: var(--color-text-inverse); border-radius: 16px 4px 16px 16px; max-width: 80%; }
    .typing { display: inline-flex; gap: 4px; }
    .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--color-sayo-amber); animation: blink 1s infinite; }
    .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
    @keyframes blink { 50% { opacity: .2; } }

    .facts { display: grid; gap: 8px; margin-left: 50px; }
    .fact { background: var(--color-bg); border: 1px solid var(--color-sayo-line); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
    .fact__label { font-size: 11px; font-weight: 700; color: var(--color-sayo-amber); display: block; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .tags span { font-size: 12px; padding: 1px 10px; border-radius: 999px; background: var(--color-sayo-amber-soft); color: var(--color-sayo-wood); }
    .src { margin-left: 50px; font-size: 11px; color: var(--color-sayo-sub); }

    .more { border-top: 1px dashed var(--color-sayo-line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .more__head { font-size: 12px; color: var(--color-sayo-sub); display: flex; justify-content: space-between; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { all: unset; cursor: pointer; font-size: 12px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--color-sayo-amber); color: var(--color-sayo-wood); }
    .chip:hover, .chip:focus-visible { background: var(--color-sayo-amber-soft); }
    .ask { display: flex; gap: 6px; }
    .ask input { flex: 1; min-width: 0; border: 1px solid var(--color-sayo-line); border-radius: 10px; padding: 8px 12px; font-size: 16px; background: var(--color-bg); }
    .ask input:focus { outline: 2px solid var(--color-sayo-amber); border-color: transparent; }
    .ask button { all: unset; cursor: pointer; padding: 8px 14px; border-radius: 10px; background: var(--color-sayo-wood); color: var(--color-text-inverse); font-weight: 700; font-size: 13px; }
    .ask button:disabled { opacity: .4; cursor: not-allowed; }

    .modal__foot {
      display: flex; gap: 8px; align-items: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--color-sayo-line); background: var(--color-sayo-paper);
    }
    .nav { all: unset; cursor: pointer; font-size: 12px; color: var(--color-sayo-sub); padding: 8px; border-radius: 8px; }
    .nav:disabled { opacity: .3; cursor: default; }
    .nav:hover:not(:disabled), .nav:focus-visible { background: var(--color-sayo-amber-soft); }
    .read { margin-left: auto; text-decoration: none; background: var(--color-accent); color: var(--color-text-inverse); font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 12px; }
    .read:focus-visible { outline: 2px solid var(--color-accent-strong); outline-offset: 2px; }
    .note { font-size: 10px; color: var(--color-sayo-sub); text-align: center; padding: 0 16px 8px; background: var(--color-sayo-paper); }
    .nav[hidden], .read[hidden] { display: none; }
    .nav, .back, .read { white-space: nowrap; }
    .pcOnly { display: none; }
    @media (min-width: 768px) { .pcOnly { display: inline; } }

    /* 検索結果（パターン1） */
    .source { margin-left: 50px; font-size: 11px; color: var(--color-sayo-sub); display: inline-flex; gap: 6px; align-items: center; }
    .source b { font-weight: 700; padding: 0 8px; border-radius: 999px; background: var(--color-sayo-amber-soft); color: var(--color-sayo-wood); }
    .results { margin-left: 50px; display: flex; flex-direction: column; gap: 8px; }
    .result { display: flex; gap: 10px; align-items: center; background: var(--color-bg); border: 1px solid var(--color-sayo-line); border-radius: 12px; padding: 8px; }
    .result__thumb { width: 48px; aspect-ratio: 2/3; border-radius: 4px; flex: none; }
    .result__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .result__title { font-weight: 700; font-size: 14px; line-height: 1.4; }
    .result__meta { font-size: 11px; color: var(--color-sayo-sub); }
    .result__tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .result__tags span { font-size: 10px; padding: 0 6px; border-radius: 999px; background: var(--color-sayo-amber-soft); color: var(--color-sayo-wood); }
    .result__acts { display: flex; flex-direction: column; gap: 4px; flex: none; }
    .result__sum { all: unset; cursor: pointer; font-size: 12px; font-weight: 700; color: var(--color-text-inverse); background: var(--color-sayo-wood); padding: 4px 10px; border-radius: 999px; text-align: center; }
    .result__sum:focus-visible { outline: 2px solid var(--color-sayo-amber); }
    .result__read { font-size: 11px; color: var(--color-accent); text-align: center; text-decoration: none; font-weight: 700; }
    .back { all: unset; cursor: pointer; font-size: 12px; color: var(--color-sayo-wood); font-weight: 700; padding: 8px; border-radius: 8px; }
    .back[hidden] { display: none; }
    .back:hover, .back:focus-visible { background: var(--color-sayo-amber-soft); }
    /* ── 「詳しく知りたい」ボタン（モーダル内） ── */
    .deep {
      all: unset; cursor: pointer; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px;
      background: linear-gradient(135deg, var(--color-surface-dark), var(--color-surface-dark-2)); color: var(--color-text-inverse);
      box-shadow: 0 0 0 1.5px var(--color-accent-strong); transition: transform .15s ease, box-shadow .15s ease;
    }
    .deep:hover { transform: translateY(-1px); box-shadow: 0 0 0 2px var(--color-accent-strong), 0 8px 20px rgba(var(--color-accent-strong-rgb), .3); }
    .deep:focus-visible { outline: 2px solid var(--color-sayo-amber); outline-offset: 3px; }
    .deep__img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; object-position: 32% 14%; flex: none; box-shadow: 0 0 0 2px var(--color-sayo-amber); }
    .deep__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .deep__body strong { font-size: 16px; }
    .deep__body small { font-size: 11px; color: var(--color-text-dim); line-height: 1.5; }
    .deep__arrow { font-size: 18px; color: var(--color-accent-strong); }

    /* ── ノベル風の画面（案C）。「詳しく知りたい」で開く ── */
    .nv {
      --nv-window: rgba(18, 12, 30, .86); --nv-line: rgba(255, 255, 255, .18); --nv-plate: #c8862e; --nv-plate-text: #1a0f06;
      --nv-text: #f5efe6; --nv-dim: #c9bda9; --nv-stage: #0d0907; --nv-spoiler: #fb7185;
      position: fixed; inset: 0; z-index: 80; background: var(--nv-stage); color: var(--nv-text); overflow: hidden; animation: nvIn .45s ease;
    }
    .nv[hidden] { display: none; }
    @keyframes nvIn { from { opacity: 0; } }
    .nv__stage { position: absolute; inset: 0; }
    .nv__blur { display: none; }
    .nv__bg { position: absolute; left: 0; top: 0; width: 100%; height: 56vh; object-fit: cover; object-position: 32% 12%; transition: transform 1.2s ease, filter .6s ease; transform-origin: 40% 30%; animation: nvZoom 1.2s ease; }
    @keyframes nvZoom { from { transform: scale(1.08); filter: brightness(.6); } }
    @media (min-width: 768px) {
      .nv__blur { display: block; position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(28px) brightness(.45); }
      .nv__bg { height: 100%; object-fit: contain; object-position: center top; }
    }
    .nv__stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(var(--color-black-rgb), .45) 0%, transparent 16%, transparent 40%, rgba(var(--color-black-rgb), .8) 100%); }
    .nv__stage[data-expression="thinking"] .nv__bg { transform: scale(1.03); filter: brightness(.9); }
    .nv__stage[data-expression="recommend"] .nv__bg { transform: scale(1.06) translate(1%, -1%); }
    .nv__stage[data-expression="sorry"] .nv__bg { filter: saturate(.6) brightness(.85); }
    .nv__stage[data-expression="secret"] .nv__bg { filter: sepia(.35) brightness(.8); transform: scale(1.04); }

    .nv__hud { position: absolute; top: 0; left: 0; right: 0; z-index: 3; display: flex; align-items: center; gap: 6px; padding: 10px 12px; }
    .nv__title { flex: 1; min-width: 0; font-family: 'Zen Old Mincho', serif; font-size: 14px; text-shadow: 0 1px 4px rgba(var(--color-black-rgb), .7); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .nv__pill { all: unset; cursor: pointer; flex: none; font-size: 12px; padding: 4px 12px; border-radius: 999px; background: rgba(var(--color-black-rgb), .5); border: 1px solid var(--nv-line); backdrop-filter: blur(6px); white-space: nowrap; }
    .nv__pill:focus-visible { outline: 2px solid var(--nv-plate); }
    .nv__pill strong { font-size: 14px; }
    span.nv__pill { cursor: default; }

    .nv__bottom { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 0 12px calc(12px + env(safe-area-inset-bottom)); }
    .nv__inner { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
    .nv__shelf { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px; scrollbar-width: none; }
    .nv__shelf:empty { display: none; }
    .nv__item { flex: 0 0 260px; display: flex; gap: 10px; align-items: center; background: rgba(255, 250, 242, .96); color: var(--color-sayo-text); border-radius: 12px; padding: 8px; box-shadow: 0 8px 24px rgba(var(--color-black-rgb), .4); animation: nvPull .5s cubic-bezier(.2,.8,.2,1) both; }
    .nv__item:nth-child(2) { animation-delay: .12s; } .nv__item:nth-child(3) { animation-delay: .24s; } .nv__item:nth-child(4) { animation-delay: .36s; }
    @keyframes nvPull { from { opacity: 0; transform: translateY(24px) rotate(-2deg); } }
    .nv__jacket { width: 40px; aspect-ratio: 2/3; border-radius: 4px; flex: none; }
    .nv__itemBody { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .nv__itemTitle { font-weight: 700; font-size: 13px; line-height: 1.35; }
    .nv__itemMeta { font-size: 10px; color: var(--color-sayo-sub); }
    .nv__itemActs { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
    .nv__itemActs a { font-size: 11px; font-weight: 700; color: var(--color-accent); text-decoration: none; }
    .nv__itemActs button { all: unset; cursor: pointer; font-size: 11px; font-weight: 700; color: var(--color-text-inverse); background: var(--color-sayo-wood); padding: 1px 8px; border-radius: 999px; }
    .nv__itemActs :focus-visible { outline: 2px solid var(--nv-plate); }
    .nv__item--now { box-shadow: 0 0 0 2px var(--nv-plate), 0 8px 24px rgba(var(--color-black-rgb), .4); }

    .nv__window { position: relative; background: var(--nv-window); border: 1px solid var(--nv-line); border-radius: 14px; padding: 22px 18px 16px; min-height: 120px; backdrop-filter: blur(8px); box-shadow: 0 12px 40px rgba(var(--color-black-rgb), .45); cursor: pointer; }
    .nv__plate { position: absolute; left: 16px; top: -14px; background: var(--nv-plate); color: var(--nv-plate-text); font-family: 'Zen Old Mincho', serif; font-size: 16px; padding: 2px 16px; border-radius: 6px; line-height: 1.6; }
    .nv__plate small { font-family: var(--font-body); font-size: 10px; margin-left: 6px; }
    .nv__plate--user { background: rgba(var(--color-white-rgb), .9); }
    .nv__badge { display: inline-block; font-size: 11px; color: var(--nv-spoiler); border: 1px solid var(--nv-spoiler); border-radius: 4px; padding: 0 6px; margin-bottom: 6px; }
    .nv__text { font-size: 14px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; min-height: 3.6em; max-height: 7.2em; overflow-y: auto; }
    @media (min-width: 768px) { .nv__text { font-size: 17px; max-height: 11em; } }
    @media (max-width: 767px) {
      .nv__window { padding: 20px 14px 12px; min-height: 0; }
      .nv__item { flex-basis: 250px; padding: 6px; }
      .nv__jacket { width: 32px; }
      .nv__title { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
      .nv__hud { justify-content: flex-end; }
      .nv__hud [data-nv-back] { margin-right: auto; }
    }
    .nv__text button { all: unset; cursor: pointer; margin-left: 8px; font-size: 13px; font-weight: 700; color: var(--nv-plate-text); background: var(--nv-plate); padding: 2px 12px; border-radius: 999px; }
    .nv__thinking { color: var(--nv-dim); font-style: italic; }
    .nv__next { position: absolute; right: 16px; bottom: 8px; font-size: 12px; color: var(--nv-plate); animation: nvNudge 1s infinite; }
    .nv__next[hidden] { display: none; }
    @keyframes nvNudge { 50% { transform: translateY(3px); } }
    /* SP：選択肢は1行の横スクロールにして、立ち絵の顔を隠さない */
    .nv__choices { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    @media (min-width: 768px) { .nv__choices { flex-wrap: wrap; overflow: visible; } }
    .nv__choice { all: unset; cursor: pointer; flex: none; white-space: nowrap; font-size: 13px; padding: 5px 14px; border-radius: 8px; background: rgba(var(--color-black-rgb), .6); border: 1px solid var(--nv-line); }
    .nv__choice::before { content: '▶ '; color: var(--nv-plate); font-size: 10px; }
    .nv__choice:hover, .nv__choice:focus-visible { border-color: var(--nv-plate); background: rgba(200, 134, 46, .25); }
    .nv__choice:disabled { opacity: .4; cursor: default; }
    .nv__reply { display: flex; gap: 8px; }
    .nv__field { flex: 1; min-width: 0; background: rgba(var(--color-black-rgb), .55); border: 1px solid var(--nv-line); border-radius: 12px; padding: 0 12px; font-size: 16px; color: var(--nv-text); }
    .nv__field::placeholder { color: var(--nv-dim); }
    .nv__field:focus { outline: none; border-color: var(--nv-plate); }
    .nv__send { all: unset; cursor: pointer; background: var(--nv-plate); color: var(--nv-plate-text); font-weight: 700; padding: 10px 18px; border-radius: 12px; }
    .nv__send:disabled { opacity: .35; cursor: not-allowed; }
    .nv__note { font-size: 10px; color: var(--nv-dim); text-align: center; text-shadow: 0 1px 2px rgba(var(--color-black-rgb), .8); }
    .nv__log { position: absolute; inset: 0 0 0 auto; z-index: 5; width: min(420px, 100%); background: rgba(12, 8, 20, .96); border-left: 1px solid var(--nv-line); transform: translateX(100%); transition: transform .3s ease; display: flex; flex-direction: column; }
    .nv__log.is-open { transform: none; }
    .nv__logHead { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--nv-line); font-family: 'Zen Old Mincho', serif; }
    .nv__logBody { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; font-size: 14px; line-height: 1.8; }
    .nv__logWho { display: block; font-size: 11px; font-weight: 700; color: var(--nv-plate); }
    .nv__logWho--user { color: var(--nv-dim); }

    .srOnly { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  </style>
</head>
<body>
  <div class="mockBar" role="region" aria-label="モック操作">
    <span class="mockBar__group">ページ：
      <button type="button" data-view="top" aria-pressed="true">TOP</button>
      <button type="button" data-view="list" aria-pressed="false">リスト（映画）</button>
    </span>
    <span>案G：案Dのモーダル ＋「詳しく知りたい」で案Cのノベル風へ</span>
  </div>

  <header class="siteHeader">KatsumaScore</header>

  <main data-root></main>

  <div class="modal" data-modal hidden>
    <div class="modal__scrim" data-close></div>
    <section class="modal__sheet" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal__grab" aria-hidden="true"></div>
      <header class="modal__top">
        <span class="modal__thumb" data-m-thumb></span>
        <div class="modal__meta">
          <div class="modal__cat" data-m-cat></div>
          <h2 class="modal__title" id="modalTitle" data-m-title></h2>
          <div class="modal__info" data-m-info></div>
        </div>
        <button type="button" class="modal__close" data-close aria-label="閉じる">✕</button>
      </header>
      <div class="modal__scroll" data-m-scroll aria-live="polite"></div>
      <footer class="modal__foot">
        <button type="button" class="back" data-back hidden>← 結果<span class="pcOnly">に戻る</span></button>
        <button type="button" class="nav" data-prev aria-label="前の作品">←<span class="pcOnly"> 前の作品</span></button>
        <button type="button" class="nav" data-next aria-label="次の作品"><span class="pcOnly">次の作品 </span>→</button>
        <a class="read" data-m-read href="#">レビューを読む</a>
      </footer>
      <p class="note">AIの回答です。要約はKatsumaScoreの記事をもとに作成し、編集部が確認しています。個人情報は入力しないでください。</p>
    </section>
  </div>

  <div class="nv" data-nv hidden role="dialog" aria-modal="true" aria-labelledby="nvTitle">
    <div class="nv__stage" data-nv-stage data-expression="default">
      <img class="nv__blur" src="img/sayo-full.webp" alt="">
      <img class="nv__bg" src="img/sayo-full.webp" alt="映画店のカウンターで頬杖をつくサヨ">
    </div>
    <div class="nv__hud">
      <button type="button" class="nv__pill" data-nv-back>← 要約に戻る</button>
      <h2 class="nv__title" id="nvTitle" data-nv-title></h2>
      <span class="nv__pill">今日あと <strong data-nv-remaining>30</strong></span>
      <button type="button" class="nv__pill" data-nv-logopen aria-controls="nvLog">履歴</button>
      <button type="button" class="nv__pill" data-nv-close aria-label="閉じて一覧に戻る">✕</button>
    </div>
    <div class="nv__bottom"><div class="nv__inner">
      <div class="nv__shelf" data-nv-shelf aria-label="サヨが棚から出した作品"></div>
      <div class="nv__window" data-nv-window aria-live="polite">
        <span class="nv__plate" data-nv-plate>サヨ<small>AI映画店主</small></span>
        <div data-nv-badge></div>
        <p class="nv__text" data-nv-text></p>
        <span class="nv__next" data-nv-next hidden>▼</span>
      </div>
      <div class="nv__choices" data-nv-choices></div>
      <form class="nv__reply" data-nv-form>
        <label class="srOnly" for="nvInput">サヨへのメッセージ</label>
        <input id="nvInput" class="nv__field" maxlength="200" autocomplete="off" placeholder="サヨに話しかける" data-nv-input>
        <button type="submit" class="nv__send" data-nv-send>話す</button>
      </form>
      <p class="nv__note">AIの回答です。ここから先の質問は1回ずつ数えます。個人情報は入力しないでください。</p>
    </div></div>
    <aside class="nv__log" id="nvLog" data-nv-log aria-label="会話の履歴">
      <div class="nv__logHead"><span>これまでの会話</span><button type="button" class="nv__pill" data-nv-logclose aria-label="履歴を閉じる">✕</button></div>
      <div class="nv__logBody" data-nv-logbody></div>
    </aside>
  </div>

  <script src="mock.js"></script>
  <script src="card-mock.js"></script>
  <script>
    (() => {
      const C = window.CardMock;
      const M = window.SayoMock;
      const $ = (s, el = document) => el.querySelector(s);
      const root = $('[data-root]');
      const params = new URLSearchParams(location.search);
      let view = params.get('view') === 'list' ? 'list' : 'top';
      let order = [];
      let current = -1;
      let lastTrigger = null;
      let remaining = 30;

      const thumbStyle = (p, deg = 160) => `background:linear-gradient(${deg}deg,hsl(${p.hue} 45% 28%),hsl(${p.hue + 30} 55% 55%))`;
      const sayoBtn = (p, label = 'サヨの要約') => `<button type="button" class="sayoBtn" data-sayo="${p.id}" aria-label="『${p.title}』をサヨに要約してもらう"><img src="img/sayo-face.webp" alt=""><span>${label}</span></button>`;

      const homeCard = (p) => `
        <li class="homeCard">
          <a class="homeCard__link" href="${p.slug}">
            <div class="homeCard__media" style="${thumbStyle(p)}">
              <span class="hex"><span>${p.score.toFixed(1)}<small>${C.scoreRank(p.score)}</small></span></span>
              <span class="dots">${p.vods.map((v) => `<i style="background:${C.VOD_COLOR[v]}"></i>`).join('')}</span>
            </div>
            <div class="homeCard__title">${p.title}</div>
            <div class="homeCard__cat">${p.category}</div>
          </a>
          ${sayoBtn(p, '要約')}
        </li>`;

      const postCard = (p, lead = false) => `
        <${lead ? 'div' : 'li'} class="postCard${lead ? ' lead' : ''}">
          <a class="postCard__link" href="${p.slug}">
            <div class="postCard__media" style="${thumbStyle(p, 135)}"></div>
            <div class="postCard__body">
              <span class="postCard__date">${p.date}</span>
              <span class="postCard__title">${p.title}</span>
              <span class="postCard__excerpt">${p.excerpt}</span>
            </div>
          </a>
          ${sayoBtn(p, lead ? 'サヨに要約してもらう' : '要約')}
        </${lead ? 'div' : 'li'}>`;

      /** パターン1の入口。scope はカテゴリ名（リスト）か null（TOP） */
      const askBox = (scope) => `
        <div class="askBox" data-askbox data-scope="${scope || ''}">
          <img class="askBox__face" src="img/sayo-face.webp" alt="サヨ">
          <div class="askBox__main">
            <p class="askBox__q">${scope ? `${scope}の中から、何を観ようか迷ったら` : '何を観ようか迷ったら'}<small>サヨ ／ AI映画店主が、KatsumaScoreの記事から探します</small></p>
            <div class="askBox__chips">${C.SEARCH_CHIPS.map((c) => `<button type="button" class="askBox__chip" data-q="${c.label}">${c.label}</button>`).join('')}</div>
            <form class="askBox__form" data-askform><label class="srOnly" for="ask-${scope || 'top'}">サヨに探してほしい作品</label><input id="ask-${scope || 'top'}" maxlength="200" placeholder="気分や好みを自由に（例：雨の日に観たい）"><button type="submit">探す</button></form>
            <span class="askBox__hint">候補ボタンは記事のタグから探します（回数は減りません）。自由入力はAIが探します（1回ずつ数えます）。カード右上の「要約」からは、作品ごとの要約を聞けます。</span>
          </div>
        </div>`;

      const renderTop = () => {
        const latest = C.POSTS;
        const high = [...C.POSTS].sort((a, b) => b.score - a.score);
        root.innerHTML = `
          <div class="top">
            ${askBox(null)}
            <section class="top__section" data-group="latest">
              <div class="top__head"><h2 class="top__title"><small>LATEST</small>最新レビュー</h2><span class="top__more">すべて見る →</span></div>
              <ul class="scroll" style="list-style:none">${latest.map(homeCard).join('')}</ul>
            </section>
            <section class="top__section" data-group="high">
              <div class="top__head"><h2 class="top__title"><small>HIGH SCORE</small>高評価</h2><span class="top__more">すべて見る →</span></div>
              <ul class="scroll" style="list-style:none">${high.map(homeCard).join('')}</ul>
            </section>
          </div>`;
      };
      const renderList = () => {
        const [lead, ...rest] = C.POSTS;
        root.innerHTML = `
          <section class="list__hero"><p class="list__eyebrow">MOVIE</p><h1 class="list__h1">映画</h1></section>
          <div class="list__body" data-group="list">
            ${askBox('映画')}
            ${postCard(lead, true)}
            <ol class="grid">${rest.map((p) => postCard(p)).join('')}</ol>
          </div>`;
      };
      const render = () => {
        if (view === 'list') renderList(); else renderTop();
        document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));
      };

      /* ── モーダル ── */
      const modal = $('[data-modal]');
      const scroll = $('[data-m-scroll]');
      const add = (html, cls = 'say') => {
        const el = document.createElement('div');
        el.className = cls;
        el.innerHTML = html;
        scroll.appendChild(el);
        scroll.scrollTop = scroll.scrollHeight;
        return el;
      };
      const sayoHtml = (inner) => `<img class="say__face" src="img/sayo-face.webp" alt=""><div class="say__body"><div class="say__name">サヨ ／ AI映画店主</div><div class="say__bubble">${inner}</div></div>`;

      /** 「詳しく知りたい」ボタン。押すとノベル風の画面へ切り替える */
      const deepBtn = (title, sub) => `<button type="button" class="deep" data-deep><img class="deep__img" src="img/sayo-full.webp" alt=""><span class="deep__body"><strong>${title}</strong><small>${sub}</small></span><span class="deep__arrow" aria-hidden="true">▶</span></button>`;

      const fillModal = async (p) => {
        $('[data-m-thumb]').setAttribute('style', thumbStyle(p));
        $('[data-m-cat]').textContent = `${p.category} ・ ${p.date}`;
        $('[data-m-title]').textContent = p.title;
        $('[data-m-info]').innerHTML = `<span class="modal__score">${p.score.toFixed(1)}<b>${C.scoreRank(p.score)}</b></span><span>${p.vodLabel}（${p.vodCheckedAt}時点）</span>`;
        $('[data-m-read]').setAttribute('href', p.slug);
        [$('[data-prev]'), $('[data-next]'), $('[data-m-read]')].forEach((el) => { el.hidden = false; });
        $('[data-back]').hidden = !searchCtx;
        $('[data-prev]').disabled = current <= 0;
        $('[data-next]').disabled = current >= order.length - 1;
        scroll.innerHTML = '';
        const t = add(sayoHtml('<span class="typing"><i></i><i></i><i></i></span>'));
        const s = await C.fetchSummary(p.id);
        t.remove();
        add(sayoHtml(`<span class="say__lead">${s.lead}</span>${M.escapeHtml(s.summary)}`));
        add(`<div class="fact"><span class="fact__label">こんな方に</span>${s.recommendFor}</div><div class="fact"><span class="fact__label">気分</span><div class="tags">${s.moodTags.map((m) => `<span>${m}</span>`).join('')}</div></div>`, 'facts');
        add('要約はネタバレなしです。見どころの続きや結末は「詳しく知りたい」から聞けます。', 'src');
        add(deepBtn(`『${p.title}』を詳しく知りたい`, '見どころ・惜しいところ・似た作品・結末まで、サヨと話しながら聞けます（ここから先はAIとの会話です）'), 'deepWrap');
        scroll.scrollTop = 0;
      };

      /* ── ノベル風の画面（案C）── */
      const nv = $('[data-nv]');
      const nvStage = $('[data-nv-stage]');
      const nvText = $('[data-nv-text]');
      const nvShelf = $('[data-nv-shelf]');
      const nvInput = $('[data-nv-input]');
      const nvLog = [];
      let nvCtx = null; // { type: 'post', p } または { type: 'search', q, scope, posts }
      let nvBusy = false;
      let nvTimer = null;

      const nvExpr = (k) => { nvStage.dataset.expression = k; };
      const nvPlate = (who) => {
        const pl = $('[data-nv-plate]');
        pl.classList.toggle('nv__plate--user', who === 'user');
        pl.innerHTML = who === 'user' ? 'あなた' : 'サヨ<small>AI映画店主</small>';
      };
      const nvPush = (who, str) => {
        nvLog.push({ who, str });
        $('[data-nv-logbody]').innerHTML = nvLog.map((h) => `<div><span class="nv__logWho${h.who === 'user' ? ' nv__logWho--user' : ''}">${h.who === 'user' ? 'あなた' : 'サヨ'}</span>${M.escapeHtml(h.str)}</div>`).join('');
      };
      /** 1文字ずつ表示。ウィンドウを押すと全文を出す（動きを減らす設定では一度に表示） */
      const nvType = (str) => new Promise((resolve) => {
        clearInterval(nvTimer);
        nvText.textContent = '';
        $('[data-nv-next]').hidden = true;
        const done = () => { clearInterval(nvTimer); nvTimer = null; nvText.textContent = str; $('[data-nv-next]').hidden = false; resolve(); };
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { done(); return; }
        let i = 0;
        nvTimer = setInterval(() => { i += 1; nvText.textContent = str.slice(0, i); nvText.scrollTop = nvText.scrollHeight; if (i >= str.length) done(); }, 28);
        $('[data-nv-window]').onclick = (e) => { if (nvTimer && !e.target.closest('button')) done(); };
      });
      const nvSync = () => {
        $('[data-nv-remaining]').textContent = remaining;
        const out = remaining <= 0;
        nvInput.disabled = out;
        nvInput.placeholder = out ? '今日はここまでです' : 'サヨに話しかける';
        $('[data-nv-send]').disabled = out || nvBusy;
        nv.querySelectorAll('[data-nv-choice]').forEach((b) => { b.disabled = nvBusy || (out && b.dataset.cost === 'llm'); });
      };
      const nvItem = (p, now) => `
        <div class="nv__item${now ? ' nv__item--now' : ''}">
          <span class="nv__jacket" style="${thumbStyle(p)}"></span>
          <span class="nv__itemBody">
            <span class="nv__itemTitle">${p.title}</span>
            <span class="nv__itemMeta">${p.category} ・ ${p.score.toFixed(1)} ${C.scoreRank(p.score)} ・ ${p.vodLabel}</span>
            <span class="nv__itemActs"><a href="${p.slug}">レビューを読む →</a>${now ? '' : `<button type="button" data-nv-talk="${p.id}">この作品の話を聞く</button>`}</span>
          </span>
        </div>`;
      /** 選択肢。cost='llm' は1回数える質問、'tags' は気分タグで探し直す（数えない） */
      const nvChoices = (items) => {
        $('[data-nv-choices]').scrollLeft = 0;
        $('[data-nv-choices]').innerHTML = items.map((c) => `<button type="button" class="nv__choice" data-nv-choice data-cost="${c.cost}" data-q="${M.escapeHtml(c.q)}">${M.escapeHtml(c.label || c.q)}</button>`).join('');
        nvSync();
      };

      /** 作品について話す：承認済み要約から始め、選択肢・自由入力はLLM（1回ずつ） */
      const nvTalkAbout = async (p) => {
        nvCtx = { type: 'post', p };
        $('[data-nv-title]').textContent = `『${p.title}』について`;
        $('[data-nv-back]').textContent = '← 要約に戻る';
        $('[data-nv-badge]').innerHTML = '';
        nvShelf.innerHTML = nvItem(p, true);
        nvPlate('sayo');
        nvExpr('recommend');
        nvChoices([...C.followUps(p).map((q) => ({ q, label: q.replace(`『${p.title}』`, '').replace(/^[のに]/, ''), cost: 'llm' })), { q: `『${p.title}』の結末を教えて（ネタバレ）`, label: '結末を教えて（ネタバレ）', cost: 'llm' }]);
        const s = await C.fetchSummary(p.id);
        const open = `『${p.title}』ですね。……少しだけ、詳しくお話しします。\n${s.summary}\n気になるところを選んでください。`;
        nvPush('sayo', open);
        await nvType(open);
      };

      /** 探した結果について話す：棚に作品を並べ、ほかの気分で探し直せる */
      const nvTalkSearch = async ({ q, scope, result }) => {
        nvCtx = { type: 'search', q, scope, posts: result.posts };
        $('[data-nv-title]').textContent = `「${q}」で探す`;
        $('[data-nv-back]').textContent = '← 結果に戻る';
        $('[data-nv-badge]').innerHTML = '';
        nvShelf.innerHTML = result.posts.map((p) => nvItem(p, false)).join('');
        nvPlate('sayo');
        nvExpr(result.posts.length ? 'recommend' : 'sorry');
        nvChoices(C.SEARCH_CHIPS.filter((c) => c.label !== q).map((c) => ({ q: c.label, label: `「${c.label}」で探す`, cost: 'tags' })));
        const open = `${result.reply}\n${scope ? `${scope}の記事から` : 'すべての記事から'}選びました。気になる作品があれば「この作品の話を聞く」を押してください。`;
        nvPush('sayo', open);
        await nvType(open);
      };

      /** 質問を送る（作品の話）か、探し直す（探した結果） */
      const nvAsk = async (q, cost) => {
        if (!q || nvBusy || !nvCtx) return;
        if (cost === 'llm' && remaining <= 0) return;
        nvBusy = true; nvSync();
        nvPush('user', q);
        nvPlate('user'); clearInterval(nvTimer); nvText.textContent = q; $('[data-nv-badge]').innerHTML = '';
        await new Promise((r) => setTimeout(r, 400));
        nvPlate('sayo'); nvExpr('thinking');
        nvText.innerHTML = '<span class="nv__thinking">（棚の前で、少し考えています……）</span>';
        if (nvCtx.type === 'search') {
          const result = await C.search(q, nvCtx.scope);
          if (result.source === 'llm') remaining -= 1;
          nvBusy = false;
          await nvTalkSearch({ q, scope: nvCtx.scope, result });
          return;
        }
        await new Promise((r) => setTimeout(r, 1100));
        remaining -= 1;
        const { p } = nvCtx;
        const r = C.followUpReply(p, q);
        nvBusy = false; nvSync();
        nvPush('sayo', r.reply);
        nvShelf.innerHTML = [nvItem(p, true), ...r.articles.map((a) => nvItem(a, false))].join('');
        if (r.reply.startsWith('【ネタバレあり】')) {
          nvExpr('secret');
          $('[data-nv-badge]').innerHTML = '<span class="nv__badge">ネタバレあり</span>';
          clearInterval(nvTimer); $('[data-nv-next]').hidden = true;
          nvText.innerHTML = '結末に触れる返事です。<button type="button" data-nv-reveal>表示する</button>';
          $('[data-nv-reveal]').addEventListener('click', () => nvType(r.reply.replace('【ネタバレあり】', '')));
          return;
        }
        nvExpr(r.articles.length ? 'recommend' : 'default');
        await nvType(r.reply);
      };

      /** モーダルの状態（要約 or 探した結果）から、ノベル画面を開く */
      const openNovel = () => {
        nvCtx = null;
        modal.hidden = true;
        nv.hidden = false;
        document.body.style.overflow = 'hidden';
        if (searchCtx && searchCtx.result && !scroll.querySelector('.fact')) nvTalkSearch(searchCtx);
        else nvTalkAbout(C.POSTS.find((p) => p.id === order[current]));
        setTimeout(() => $('[data-nv-back]').focus(), 50);
      };
      /** ノベル画面からモーダルへ戻る（作品の話なら要約、探した結果なら結果） */
      const backFromNovel = () => {
        clearInterval(nvTimer);
        nv.hidden = true;
        $('[data-nv-log]').classList.remove('is-open');
        modal.hidden = false;
        if (nvCtx && nvCtx.type === 'search') { showSearch(); return; }
        const id = nvCtx.p.id;
        if (!order.includes(id)) order.push(id);
        current = order.indexOf(id);
        fillModal(nvCtx.p);
      };
      const closeNovel = () => {
        clearInterval(nvTimer);
        nv.hidden = true;
        $('[data-nv-log]').classList.remove('is-open');
        close();
      };

      nv.addEventListener('click', (e) => {
        const c = e.target.closest('[data-nv-choice]');
        if (c) { nvAsk(c.dataset.q, c.dataset.cost); return; }
        const t = e.target.closest('[data-nv-talk]');
        if (t && !nvBusy) nvTalkAbout(C.POSTS.find((p) => p.id === Number(t.dataset.nvTalk)));
      });
      $('[data-nv-form]').addEventListener('submit', (e) => {
        e.preventDefault();
        const q = nvInput.value.trim();
        nvInput.value = '';
        nvAsk(q, 'llm');
      });
      $('[data-nv-back]').addEventListener('click', backFromNovel);
      $('[data-nv-close]').addEventListener('click', closeNovel);
      $('[data-nv-logopen]').addEventListener('click', () => $('[data-nv-log]').classList.add('is-open'));
      $('[data-nv-logclose]').addEventListener('click', () => $('[data-nv-log]').classList.remove('is-open'));

      /* ── パターン1：探す ── */
      let searchCtx = null;
      const resultHtml = (p) => `
        <div class="result">
          <span class="result__thumb" style="${thumbStyle(p)}"></span>
          <div class="result__body">
            <span class="result__title">${p.title}</span>
            <span class="result__meta">${p.category} ・ ${p.score.toFixed(1)} ${C.scoreRank(p.score)} ・ ${p.vodLabel}</span>
            <span class="result__tags">${p.moodTags.map((t) => `<span>${t}</span>`).join('')}</span>
          </div>
          <div class="result__acts">
            <button type="button" class="result__sum" data-sum="${p.id}">要約を聞く</button>
            <a class="result__read" href="${p.slug}">レビューへ</a>
          </div>
        </div>`;

      const showSearch = () => {
        const { q, scope, result } = searchCtx;
        $('[data-m-thumb]').setAttribute('style', 'background:url(img/sayo-face.webp) center/cover');
        $('[data-m-cat]').textContent = `サヨと探す ・ ${scope ? `${scope}の記事から` : 'すべての記事から'}`;
        $('[data-m-title]').textContent = `「${q}」`;
        $('[data-m-info]').innerHTML = '';
        [$('[data-prev]'), $('[data-next]'), $('[data-m-read]'), $('[data-back]')].forEach((el) => { el.hidden = true; });
        scroll.innerHTML = '';
        add(`<div class="say__bubble">${M.escapeHtml(q)}</div>`, 'say say--user');
        if (!result) return add(sayoHtml('<span class="typing"><i></i><i></i><i></i></span>'));
        add(sayoHtml(M.escapeHtml(result.reply)));
        add(result.source === 'tags' ? '<b>記事のタグから</b>回数は減りません' : `<b>AIが記事から</b>1回使いました（今日あと ${remaining} 回）`, 'source');
        if (result.posts.length) add(result.posts.map(resultHtml).join(''), 'results');
        if (result.posts.length) add(deepBtn('詳しく知りたい', '選んだ作品の話を、サヨの映画店でゆっくり聞けます。ほかの気分で探し直すこともできます'), 'deepWrap');
        const others = C.SEARCH_CHIPS.filter((c) => c.label !== q);
        add(`<div class="more__head"><span>ほかの気分で探す</span></div><div class="chips">${others.map((c) => `<button type="button" class="chip" data-q="${c.label}">${c.label}</button>`).join('')}</div>`, 'more');
        scroll.scrollTop = 0;
        return null;
      };

      const openSearch = async (q, scope, trigger) => {
        if (!q) return;
        searchCtx = { q, scope, result: null };
        lastTrigger = trigger;
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        showSearch();
        const result = await C.search(q, scope);
        if (result.source === 'llm') remaining -= 1;
        if (searchCtx && searchCtx.q === q) { searchCtx.result = result; showSearch(); }
      };

      const openFor = (id, trigger) => {
        searchCtx = null;
        const group = trigger.closest('[data-group]');
        order = [...new Set([...group.querySelectorAll('[data-sayo]')].map((b) => Number(b.dataset.sayo)))];
        current = order.indexOf(Number(id));
        lastTrigger = trigger;
        modal.hidden = false;
        document.body.style.overflow = 'hidden';
        fillModal(C.POSTS.find((p) => p.id === Number(id)));
        setTimeout(() => $('.modal__close').focus(), 50);
      };
      const close = () => {
        searchCtx = null;
        modal.hidden = true;
        document.body.style.overflow = '';
        if (lastTrigger) lastTrigger.focus();
      };
      const step = (d) => {
        const n = current + d;
        if (n < 0 || n >= order.length) return;
        current = n;
        fillModal(C.POSTS.find((p) => p.id === order[current]));
      };

      root.addEventListener('click', (e) => {
        const chip = e.target.closest('[data-askbox] [data-q]');
        if (chip) { openSearch(chip.dataset.q, chip.closest('[data-askbox]').dataset.scope || null, chip); return; }
        const b = e.target.closest('[data-sayo]');
        if (!b) return;
        e.preventDefault();
        openFor(b.dataset.sayo, b);
      });
      root.addEventListener('submit', (e) => {
        const f = e.target.closest('[data-askform]');
        if (!f) return;
        e.preventDefault();
        const i = f.querySelector('input');
        openSearch(i.value.trim(), f.closest('[data-askbox]').dataset.scope || null, i);
        i.value = '';
      });
      scroll.addEventListener('click', (e) => {
        if (e.target.closest('[data-deep]')) { openNovel(); return; }
        const sum = e.target.closest('[data-sum]');
        if (sum) {
          order = searchCtx.result.posts.map((p) => p.id);
          current = order.indexOf(Number(sum.dataset.sum));
          fillModal(C.POSTS.find((p) => p.id === Number(sum.dataset.sum)));
          return;
        }
        const again = e.target.closest('[data-q]');
        if (again && searchCtx) { openSearch(again.dataset.q, searchCtx.scope, again); return; }
        const a = e.target.closest('[data-jump]');
        if (!a) return;
        e.preventDefault();
        searchCtx = null;
        const id = Number(a.dataset.jump);
        if (!order.includes(id)) order.push(id);
        current = order.indexOf(id);
        fillModal(C.POSTS.find((p) => p.id === id));
      });
      modal.querySelectorAll('[data-close]').forEach((el) => el.addEventListener('click', close));
      $('[data-back]').addEventListener('click', showSearch);
      $('[data-prev]').addEventListener('click', () => step(-1));
      $('[data-next]').addEventListener('click', () => step(1));
      document.addEventListener('keydown', (e) => {
        if (!nv.hidden) { if (e.key === 'Escape') backFromNovel(); return; }
        if (modal.hidden) return;
        if (e.key === 'Escape') close();
        if (e.key === 'ArrowLeft' && e.target.tagName !== 'INPUT') step(-1);
        if (e.key === 'ArrowRight' && e.target.tagName !== 'INPUT') step(1);
      });
      document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => { view = b.dataset.view; render(); }));

      // 一覧ギャラリー（placements.html）に埋め込むときは切替バーを隠す
      if (params.get('embed')) document.querySelector('.mockBar').remove();
      render();
      const openId = params.get('open');
      if (openId) {
        const b = root.querySelector(`[data-sayo="${openId}"]`);
        if (b) openFor(openId, b);
      }
      const novelId = params.get('novel');
      if (novelId) {
        const b = root.querySelector(`[data-sayo="${novelId}"]`);
        if (b) { openFor(novelId, b); openNovel(); }
      }
    })();
  </script>
</body>
</html>
