<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KatsumaScore Showcase Variations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Noto+Sans+JP:wght@700&display=swap');
        :root { --neon: #00ffcc; --bg: #0f172a; }
        body { background-color: var(--bg); color: white; font-family: 'Noto Sans JP', sans-serif; overflow-x: hidden; }
        .hero-section { display: none; height: 450px; position: relative; overflow: hidden; align-items: center; }
        .hero-section.active { display: flex; }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .poster-card { width: 140px; height: 200px; border-radius: 8px; background: linear-gradient(45deg, #1e293b, #334155); shrink-0; }
        .neon-text { color: var(--neon); text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }
    </style>
</head>
<body>

<nav class="p-4 flex gap-4 bg-black/80 sticky top-0 z-50 justify-center">
    <button onclick="showHero(1)" class="px-3 py-1 rounded border border-white/20 text-xs hover:bg-white/10 transition">2-A: 無限グリッド流動</button>
    <button onclick="showHero(2)" class="px-3 py-1 rounded border border-white/20 text-xs hover:bg-white/10 transition">2-B: フォーカス・スタック</button>
    <button onclick="showHero(3)" class="px-3 py-1 rounded border border-white/20 text-xs hover:bg-white/10 transition">2-C: ホリゾンタル・リール</button>
</nav>

<section id="hero1" class="hero-section active px-8">
    <div class="absolute inset-0 opacity-20 flex gap-6" id="grid-stream" style="transform: rotate(-10deg) scale(1.2);">
        <div class="flex flex-col gap-6 stream-col">
            <div class="poster-card"></div><div class="poster-card"></div><div class="poster-card"></div>
        </div>
        <div class="flex flex-col gap-6 stream-col" style="margin-top: -100px;">
            <div class="poster-card"></div><div class="poster-card"></div><div class="poster-card"></div>
        </div>
        <div class="flex flex-col gap-6 stream-col">
            <div class="poster-card"></div><div class="poster-card"></div><div class="poster-card"></div>
        </div>
    </div>
    <div class="relative z-10 w-full max-w-5xl mx-auto">
        <div class="glass-panel p-10 rounded-3xl max-w-lg border-l-4 border-[#00ffcc]">
            <h1 class="text-6xl font-black mb-2 italic tracking-tighter">SCI-FI</h1>
            <p class="text-white/60 mb-6 font-light">未知のテクノロジーと、まだ見ぬ未来の物語。</p>
            <div class="flex items-center gap-4">
                <div class="text-3xl font-bold neon-text">8.9</div>
                <div class="text-xs text-white/40 uppercase tracking-widest leading-tight">Average<br>KatsumaScore</div>
            </div>
        </div>
    </div>
</section>

<section id="hero2" class="hero-section px-8 justify-center">
    <div class="absolute right-0 top-0 bottom-0 w-1/2 flex items-center justify-center pointer-events-none">
        <div class="relative w-64 h-80" id="stack-container">
            <div class="absolute inset-0 poster-card shadow-2xl" style="transform: translate(40px, 40px) rotate(5deg); opacity: 0.3;"></div>
            <div class="absolute inset-0 poster-card shadow-2xl" style="transform: translate(20px, 20px) rotate(2deg); opacity: 0.6;"></div>
            <div class="absolute inset-0 poster-card shadow-2xl border border-white/20" id="main-poster"></div>
        </div>
    </div>
    <div class="relative z-10 w-full max-w-5xl mx-auto flex">
        <div class="max-w-md">
            <span class="text-xs font-bold bg-white/10 px-3 py-1 rounded-full mb-4 inline-block">TRENDING CATEGORY</span>
            <h1 class="text-7xl font-black mb-4">HORROR</h1>
            <p class="text-lg text-white/80 leading-relaxed mb-8">あなたの「恐怖」を再定義する。<br>静寂の中に潜む、真の絶望。</p>
            <button class="bg-[#00ffcc] text-black font-bold px-8 py-3 rounded-full hover:scale-105 transition">作品をスコアで選ぶ</button>
        </div>
    </div>
</section>

<section id="hero3" class="hero-section px-8">
    <div class="absolute bottom-0 left-0 right-0 py-10 opacity-40">
        <div class="flex gap-8" id="reel-stream">
            <div class="poster-card"></div><div class="poster-card"></div><div class="poster-card"></div>
            <div class="poster-card"></div><div class="poster-card"></div><div class="poster-card"></div>
            <div class="poster-card"></div><div class="poster-card"></div><div class="poster-card"></div>
        </div>
    </div>
    <div class="relative z-10 w-full max-w-5xl mx-auto">
        <nav class="flex gap-2 text-[10px] text-white/40 mb-4">
            <span>HOME</span><span>/</span><span>GENRE</span><span>/</span><span class="text-white">ANIMATION</span>
        </nav>
        <h1 class="text-6xl font-black mb-6 flex items-baseline gap-4">
            ANIMATION <span class="text-sm font-normal text-[#00ffcc] tracking-[0.5em] uppercase">Selection</span>
        </h1>
        <div class="flex gap-4">
            <div class="glass-panel px-6 py-4 rounded-xl">
                <div class="text-[10px] text-white/50 mb-1">Weekly Top</div>
                <div class="font-bold">劇場版：虚構の境界</div>
            </div>
            <div class="glass-panel px-6 py-4 rounded-xl border-t-2 border-[#00ffcc]">
                <div class="text-[10px] text-white/50 mb-1">New Review</div>
                <div class="font-bold">サイバー・エデン</div>
            </div>
        </div>
    </div>
</section>

<script>
    function showHero(index) {
        document.querySelectorAll('.hero-section').forEach(el => el.classList.remove('active'));
        const target = document.getElementById('hero' + index);
        target.classList.add('active');

        if(index === 1) {
            gsap.to(".stream-col", { y: -50, duration: 20, repeat: -1, yoyo: true, ease: "none" });
            gsap.from("#hero1 h1", { x: -30, opacity: 0, duration: 1 });
        }
        if(index === 2) {
            gsap.from("#stack-container div", { 
                x: 100, opacity: 0, stagger: 0.2, duration: 1, ease: "power2.out" 
            });
        }
        if(index === 3) {
            gsap.to("#reel-stream", { x: -200, duration: 15, repeat: -1, yoyo: true, ease: "none" });
            gsap.from("#hero3 h1", { scale: 0.9, opacity: 0, duration: 0.8 });
        }
    }
    window.onload = () => showHero(1);
</script>
</body>
</html>
