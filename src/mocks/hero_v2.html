<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KatsumaScore Hero - Cards Effect</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b14;
      --accent: #ff2dfc; /* KatsumaScore ブランドカラー */
      --card-width: 280px;
      --card-height: 392px; /* 1000:1400 ratio */
    }

    body {
      background: var(--bg-dark);
      color: white;
      font-family: 'Noto Sans JP', sans-serif;
      overflow: hidden;
    }

    /* ヒーローコンテナ全体 */
    .hero-wrapper {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Swiper Cards Effect カスタマイズ */
    .swiper {
      width: var(--card-width);
      height: var(--card-height);
    }

    .swiper-slide {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      background: #111;
    }

    .swiper-slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 情報レイヤー（スコア・テキスト） */
    .info-container {
      margin-top: 40px;
      text-align: center;
      pointer-events: none;
    }

    .score-box {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    /* スコア背後の六角形SVG */
    .hexagon-svg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 140px;
      height: 140px;
      z-index: -1;
    }

    .hexagon-path {
      fill: none;
      stroke: var(--accent);
      stroke-width: 2;
      stroke-dasharray: 400;
      stroke-dashoffset: 400;
    }

    .score-val {
      font-size: 64px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      opacity: 0;
    }

    .text-meta {
      opacity: 0;
    }

    .copy {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .title {
      font-size: 2rem;
      color: #fff;
    }

    /* モバイル調整 */
    @media (min-width: 768px) {
      :root {
        --card-width: 340px;
        --card-height: 476px;
      }
      .info-container { margin-top: 60px; }
      .score-val { font-size: 80px; }
      .title { font-size: 3rem; }
    }
  </style>
</head>
<body>

<div class="hero-wrapper">
  
  <div class="swiper main-slider">
    <div class="swiper-wrapper">
      <div class="swiper-slide" data-score="9.2" data-copy="震えるほどの、熱狂を。" data-title="DUNE PART TWO">
        <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=800">
      </div>
      <div class="swiper-slide" data-score="8.5" data-copy="愛が、すべてを壊す。" data-title="OPPENHEIMER">
        <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=800">
      </div>
      <div class="swiper-slide" data-score="7.8" data-copy="その結末に、涙する。" data-title="PERFECT DAYS">
        <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=800">
      </div>
    </div>
  </div>

  <div class="info-container">
    <div class="score-box">
      <svg class="hexagon-svg" viewBox="0 0 100 100">
        <path class="hexagon-path" d="M50 5 L90 27.5 L90 72.5 L50 95 L10 72.5 L10 27.5 Z"></path>
      </svg>
      <div id="score-num" class="score-val">0.0</div>
    </div>
    
    <div class="text-meta">
      <div id="copy-text" class="copy">---</div>
      <h2 id="title-text" class="title text-white">---</h2>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

<script>
  // テキスト情報の更新関数
  function updateText(slide) {
    document.getElementById('copy-text').innerText = slide.dataset.copy;
    document.getElementById('title-text').innerText = slide.dataset.title;
  }

  const swiper = new Swiper(".main-slider", {
    effect: "cards",
    grabCursor: true,
    loop: true,
    autoplay: {
      delay: 5000,
      disableOnInteraction: false,
    },
    on: {
      init: function() {
        updateText(this.slides[this.activeIndex]);
        animateIn(this.slides[this.activeIndex]);
      },
      slideChangeTransitionStart: function() {
        animateOut();
      },
      slideChangeTransitionEnd: function() {
        updateText(this.slides[this.activeIndex]);
        animateIn(this.slides[this.activeIndex]);
      }
    }
  });

  // GSAP 登場アニメーション
  function animateIn(slide) {
    const targetScore = parseFloat(slide.dataset.score);
    const tl = gsap.timeline();

    tl.to(".hexagon-path", {
      strokeDashoffset: 0,
      duration: 0.8,
      ease: "power2.out"
    })
    .to(".score-val", {
      opacity: 1,
      y: 0,
      duration: 0.4
    }, "-=0.4")
    .to("#score-num", {
      innerText: targetScore,
      duration: 1.2,
      snap: { innerText: 0.1 }, // 0.1刻みでカウントアップ
      ease: "power3.out"
    }, "-=0.6")
    .to(".text-meta", {
      opacity: 1,
      y: 0,
      stagger: 0.2,
      duration: 0.6,
      ease: "power2.out"
    }, "-=0.8");
  }

  // GSAP 退場アニメーション
  function animateOut() {
    gsap.to([".score-val", ".text-meta"], {
      opacity: 0,
      y: 20,
      duration: 0.3
    });
    gsap.set(".hexagon-path", {
      strokeDashoffset: 400
    });
    gsap.set("#score-num", { innerText: "0.0" });
  }
</script>

</body>
</html>
