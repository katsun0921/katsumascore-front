name: UI Test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:scss

      # next-env.d.ts は .gitignore 対象でリポジトリに存在しないため、
      # `tsc --noEmit` の前に `next typegen` で生成する必要がある。
      # このファイルが無いと next/image-types/global（.webp 等の画像モジュール宣言）が
      # 読み込まれず、TS2307 で失敗する。
      - name: Type check
        run: npm run typecheck

      - name: 詳細SSGとWP通信の回帰テスト
        run: npm run test:ssg

      - name: WordPress REST schema regression test
        run: npm run test:wp-schema

      # generated/wp-schema.d.ts は openapi/wp.yaml からの生成物。
      # 手編集すると次回の `npm run wp:gen-types` で消えるため、
      # 再生成しても差分が出ないことを検査する。
      - name: Check generated WP schema is up to date
        run: |
          npm run wp:gen-types

          if ! git diff --exit-code --stat -- src/libs/api/wordpress/generated/wp-schema.d.ts; then
            echo ""
            echo "::error::generated/wp-schema.d.ts が openapi/wp.yaml と一致しません。"
            echo "手編集した型は endpoints/ 配下のファイルへ移動し、"
            echo "npm run wp:gen-types を実行した結果をコミットしてください。"
            exit 1
          fi

      - name: Build Storybook
        run: npm run build-storybook

      - name: Chromatic Visual Test
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN is not set, so Chromatic was skipped."
            exit 0
          fi

          npm run chromatic -- --project-token="$CHROMATIC_PROJECT_TOKEN" --exit-zero-on-changes

  # Dependabot の PR は、上の test が通りメジャー更新でなければ自動でマージする。
  auto-merge:
    needs: test
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot のメタデータを取得
        id: meta
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: パッチ・マイナー更新ならマージ
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --merge --delete-branch
