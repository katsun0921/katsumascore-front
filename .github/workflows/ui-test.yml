name: UI Test

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Stylelint
        run: npm run lint:scss

      - name: Type check
        run: npx tsc --noEmit

      # generated/wp-schema.d.ts は openapi/wp.yaml からの生成物。
      # 手編集すると次回の `npm run wp:gen-types` で消えるため、
      # 再生成しても差分が出ないことを検査する。
      - name: Check generated WP schema is up to date
        run: |
          npm run wp:gen-types

          if ! git diff --exit-code --stat -- src/libs/api/wordpress/generated/wp-schema.d.ts; then
            echo ""
            echo "::error::generated/wp-schema.d.ts が openapi/wp.yaml と一致しません。"
            echo "手編集した型は endpoints/ 配下のファイルへ移動し、"
            echo "npm run wp:gen-types を実行した結果をコミットしてください。"
            exit 1
          fi

      - name: Build Storybook
        run: npm run build-storybook

      - name: Chromatic Visual Test
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "CHROMATIC_PROJECT_TOKEN is not set, so Chromatic was skipped."
            exit 0
          fi

          npm run chromatic -- --project-token="$CHROMATIC_PROJECT_TOKEN" --exit-zero-on-changes
