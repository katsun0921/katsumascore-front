# main への push（マージ完了後）で Cloudflare Workers へデプロイし、
# デプロイ成功後に vX.Y.Z 形式の Git タグを patch 更新する。
#
# 必要な GitHub Secrets（Repository settings → Secrets and variables → Actions）:
#   CLOUDFLARE_API_TOKEN  — Workers デプロイ権限付き API トークン
#   WP_API_URL            — 本番 WordPress REST ベース（末尾スラッシュなし）
#   NEXT_PUBLIC_WP_BASE_URL
#   NEXT_PUBLIC_SITE_URL  — 本番のこのフロントの URL（workers.dev またはカスタムドメイン）
#   NEXT_PUBLIC_SITE_NAME
#
# 任意:
#   CLOUDFLARE_ACCOUNT_ID
#
# 季節レビュー親スラッグ・カテゴリスラッグ・genre/vod の REST パスはコード固定（`src/config/wpContent.config.ts`）。
#
# Worker 上のシークレット（REVALIDATE_SECRET 等）は wrangler secret で登録済みのものが
# デプロイ後も引き続き使われます（このワークフローで毎回上書きはしません）。

name: Deploy Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudflare-workers-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WP_API_URL: ${{ secrets.WP_API_URL }}
          NEXT_PUBLIC_WP_BASE_URL: ${{ secrets.NEXT_PUBLIC_WP_BASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
        run: npm run deploy

      - name: Update version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git fetch --tags --force

          LATEST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [ -z "$LATEST_TAG" ]; then
            NEXT_TAG="v1.0.0"
          else
            LATEST_TAG_SHA="$(git rev-list -n 1 "$LATEST_TAG")"

            if [ "$LATEST_TAG_SHA" = "$GITHUB_SHA" ]; then
              echo "Latest version tag $LATEST_TAG already points to this commit."
              exit 0
            fi

            VERSION="${LATEST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
            NEXT_TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT_TAG" -m "Release $NEXT_TAG"
          git push origin "$NEXT_TAG"
